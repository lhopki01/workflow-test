name: security-job

on:
  pull_request:
    branches:
      - main

# Add permissions block to allow triggering other workflows
permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Security Scan
        run: |
          echo "Security Scan"
          exit 1
