  #      server: ${{ fromJson(github.event.inputs.servers) }}
  #  steps:
  #    - name: Output server input
  #      run: |
  #        echo "Server: ${{ matrix.server }}"

  output_servers:
    runs-on: ubuntu-latest
    steps:
      - name: Output servers input
        run: |
          echo "test-branch branch job"
          echo "Raw servers input: ${{ github.event.inputs.servers }}"
          echo "Iterating over servers:"
          for server in $(echo '${{ github.event.inputs.servers }}' | jq -r '.[]'); do
            echo "  - $server"
          done
