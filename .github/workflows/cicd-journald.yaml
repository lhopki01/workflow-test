name: cicd-journald

on:
  workflow_dispatch:
    inputs:
      servers:
        description: 'JSON string array of servers to target (e.g., ["server1", "server2"], defaults to ["all"])'
        required: false
        default: '["all"]'
        type: string

jobs:
  #matrix_servers:
